<body>
<div class="shell">
  <aside class="sidebar glass" id="sidebar" aria-label="数据视图导航">
    <div class="brand"><strong>Materials Lab</strong><span>Evidence & mechanism workspace</span></div>
    <div class="drop" id="drop-zone">
      <label for="file-input">加载本地 JSON / CSV</label>
      <p>文件仅在浏览器内解析，不上传、不执行其中的代码。</p>
      <p class="drop-hint">也可以把 JSON / CSV 拖到此处或页面任意位置。</p>
      <label class="file-button" for="file-input">选择文件</label>
      <input class="sr-only" id="file-input" type="file" accept=".json,.csv,.tsv,application/json,text/csv,text/tab-separated-values">
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-footer">底层 JSON 是事实源。图布局表示关系，不表示概率、贡献或因果强度。</div>
  </aside>
