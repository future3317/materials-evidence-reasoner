<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc"><title id="title">真实 LLM 对照：不用 Skill 与使用 Skill</title><desc id="desc">同一份原始 CSV 和同一个 GPT-5.6-luna 模型，只改变是否使用 Materials Evidence Reasoner，按八项科研交付维度比较。</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif;fill:#1d1d1f}.title{font-size:26px;font-weight:700;letter-spacing:-.03em}.sub,.legend{font-size:13px;fill:#6e6e73}.label{font-size:14px}.value{font-size:13px;fill:#248a3d;font-weight:700}.track{fill:#e5e5ea}.base{fill:#af52de}.skill{fill:#34c759}</style><text x="48" y="44" class="title">真实 LLM 对照：不用 Skill，和使用 Skill</text><text x="48" y="68" class="sub">GPT-5.6-luna · 同一份 error-budget-demo.csv · rubric 覆盖率，不是模型准确率</text><text x="242" y="112" text-anchor="end" class="label">核心科学判断</text><rect x="260" y="94" width="770" height="10" rx="5" class="track"/><rect x="260" y="94" width="770.0" height="10" rx="5" class="base"/><rect x="260" y="109" width="770" height="10" rx="5" class="track"/><rect x="260" y="109" width="770.0" height="10" rx="5" class="skill"/><text x="1046" y="112" class="value">100%</text><text x="242" y="162" text-anchor="end" class="label">原始数值与单位</text><rect x="260" y="144" width="770" height="10" rx="5" class="track"/><rect x="260" y="144" width="770.0" height="10" rx="5" class="base"/><rect x="260" y="159" width="770" height="10" rx="5" class="track"/><rect x="260" y="159" width="770.0" height="10" rx="5" class="skill"/><text x="1046" y="162" class="value">100%</text><text x="242" y="212" text-anchor="end" class="label">误差分解</text><rect x="260" y="194" width="770" height="10" rx="5" class="track"/><rect x="260" y="194" width="770.0" height="10" rx="5" class="base"/><rect x="260" y="209" width="770" height="10" rx="5" class="track"/><rect x="260" y="209" width="770.0" height="10" rx="5" class="skill"/><text x="1046" y="212" class="value">100%</text><text x="242" y="262" text-anchor="end" class="label