<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Materials Evidence Reasoner Skill A/B uplift summary</title>
  <desc id="desc">Two panels compare reported baseline and Skill scores. Kimi-K2.7-Code rises from 59 to 75 and GLM-5.2 rises from 58 to 78. In the GPT-5.6-luna rubric, core scientific judgment stays at 100 percent while evidence traceability rises from 0 to 94 percent and machine contract rises from 0 to 100 percent.</desc>
  <style>
    .bg { fill: #f7f7fb; }
    .ink { fill: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .muted { fill: #6e6e73; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .grid { stroke: #d2d2d7; stroke-width: 1; }
    .baseline { fill: #8e8e93; }
    .skill { fill: #34c759; }
    .axis { stroke: #8e8e93; stroke-width: 1.2; }
    .value { fill: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; font-weight: 600; text-anchor: middle; }
    .tick { fill: #6e6e73; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; text-anchor: end; }
    .label { fill: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 16px; text-anchor: middle; }
    .small { fill: #6e6e73; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }
  </style>
  <rect class="bg" width="1200" height="650" rx="28"/>
  <text class="ink" x="60" y="58" font-size="30" font-weight="600">Skill effect, shown in each model's own rubric</text>
  <text class="muted" x="60" y="88" font-size="16">Observed A/B results · baseline = no Skill · green = with Skill</text>

  <!-- Panel 1: 0-100 weighted scores -->
  <text class="ink" x="85" y="142" font-size="20" font-weight="600">Weighted score (0–100)</text>
  <text class="muted" x="85" y="168" font-size="14">Kimi-K2.7-Code and GLM-5.2</text>
  <line class="grid" x1="100" y1="520" x2="530" y2="520"/>
  <line class="grid" x1="100" y1="440" x2="530" y2="440"/>
  <line class="grid" x1="100" y1="360" x2="530" y2="360"/>
  <line class="grid" x1="100" y1="280" x2="530" y2="280"/>
  <line class="grid" x1="100" y1="200" x2="530" y2="200"/>
  <line class="grid" x1="100" y1="120" x2="530" y2="120"/>
  <text class="tick" x="90" y="525">0</text>
  <text class="tick" x="90" y="445">20</text>
  <text class="tick" x="90" y="365">40</text>
  <text class="tick" x="90" y="285">60</text>
  <text class="tick" x="90" y="205">80</text>
  <text class="tick" x="90" y="125">100</text>
  <line class="axis" x1="100" y1="520" x2="530" y2="520"/>
  <rect class="baseline" x="165" y="284" width="54" height="236" rx="10"/>
  <rect class="skill" x="225" y="220" width="54" height="300" rx="10"/>
  <text class="value" x="192" y="268">59</text>
  <text class="value" x="252" y="204">75</text>
  <text class="label" x="222" y="555">Kimi</text>
  <text class="muted" x="222" y="578" font-size="13" text-anchor="middle">+16 · +27.1%</text>
  <rect class="baseline" x="350" y="288" width="54" height="232" rx="10"/>
  <rect class="skill" x="410" y="208" width="54" height="312" rx="10"/>
  <text class="value" x="377" y="272">58</text>
  <text class="value" x="437" y="192">78</text>
  <text class="label" x="417" y="555">GLM</text>
  <text class="muted" x="417" y="578" font-size="13" text-anchor="middle">+20 · +34.5%</text>

  <!-- Panel 2: GPT rubric coverage -->
  <text class="ink" x="650" y="142" font-size="20" font-weight="600">Rubric coverage (%)</text>
  <text class="muted" x="650" y="168" font-size="14">GPT-5.6-luna · one frozen task per mode</text>
  <line class="grid" x1="665" y1="520" x2="1115" y2="520"/>
  <line class="grid" x1="665" y1="440" x2="1115" y2="440"/>
  <line class="grid" x1="665" y1="360" x2="1115" y2="360"/>
  <line class="grid" x1="665" y1="280" x2="1115" y2="280"/>
  <line class="grid" x1="665" y1="200" x2="1115" y2="200"/>
  <line class="grid" x1="665" y1="120" x2="1115" y2="120"/>
  <text class="tick" x="655" y="525">0</text>
  <text class="tick" x="655" y="445">20</text>
  <text class="tick" x="655" y="365">40</text>
  <text class="tick" x="655" y="285">60</text>
  <text class="tick" x="655" y="205">80</text>
  <text class="tick" x="655" y="125">100</text>
  <line class="axis" x1="665" y1="520" x2="1115" y2="520"/>
  <rect class="baseline" x="700" y="120" width="54" height="400" rx="10"/>
  <rect class="skill" x="760" y="120" width="54" height="400" rx="10"/>
  <text class="value" x="727" y="105">100</text>
  <text class="value" x="787" y="105">100</text>
  <text class="label" x="757" y="555">核心判断</text>
  <text class="muted" x="757" y="578" font-size="13" text-anchor="middle">0 pp</text>
  <rect class="baseline" x="850" y="520" width="54" height="0" rx="10"/>
  <rect class="skill" x="910" y="144" width="54" height="376" rx="10"/>
  <text class="value" x="877" y="505">0</text>
  <text class="value" x="937" y="129">94</text>
  <text class="label" x="907" y="555">证据回查</text>
  <text class="muted" x="907" y="578" font-size="13" text-anchor="middle">+94 pp</text>
  <rect class="baseline" x="1000" y="520" width="54" height="0" rx="10"/>
  <rect class="skill" x="1060" y="120" width="54" height="400" rx="10"/>
  <text class="value" x="1027" y="505">0</text>
  <text class="value" x="1087" y="105">100</text>
  <text class="label" x="1057" y="555">机器接口</text>
  <text class="muted" x="1057" y="578" font-size="13" text-anchor="middle">+100 pp</text>

  <rect class="baseline" x="60" y="612" width="16" height="16" rx="4"/>
  <text class="small" x="84" y="625">不用 Skill</text>
  <rect class="skill" x="190" y="612" width="16" height="16" rx="4"/>
  <text class="small" x="214" y="625">使用 Skill</text>
  <text class="muted" x="650" y="625">不同模型的 rubric 不直接换算或合并</text>
</svg>
